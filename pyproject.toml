[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "msadiscordapp"
version = "0.1.3"
description = "A bot for the MSA competitive quidditch champions server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click == 8.1.7",
  "discord.py == 2.4.0",
  "pydantic == 2.10.4",
  "aiosqlite == 0.20.0",
  "aiofiles==24.1.0"
]

[project.scripts]
msadiscordapp = "msadiscordapp.cli:main"
